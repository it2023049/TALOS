name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify expected source files
        run: |
          test -f src/chat/mass_extract.py
          test -f src/chat/facebook_extract.py
          test -f src/chat/viber_extract.py
          test -f src/chat/extractor_utils.py
          test -f src/audio/audio_diarize.py
          test -f src/audio/audio_utils.py
          test -f src/email/email_extract.py

      - name: Compile Python files
        run: |
          python -m py_compile \
            src/chat/mass_extract.py \
            src/chat/facebook_extract.py \
            src/chat/viber_extract.py \
            src/chat/extractor_utils.py \
            src/audio/audio_diarize.py \
            src/audio/audio_utils.py \
            src/email/email_extract.py